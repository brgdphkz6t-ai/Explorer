<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Virtual Museum</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4a90d9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loading-screen h1 {
      color: #fff;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    #loading-screen p {
      color: #aaa;
      font-size: 1rem;
    }

    #loading-progress {
      margin-top: 20px;
      color: #4a90d9;
      font-size: 0.9rem;
    }

    /* Controls Info Overlay */
    #controls-info {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 15px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 100;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #controls-info h3 {
      margin-bottom: 10px;
      color: #4a90d9;
      font-size: 1rem;
    }

    #controls-info ul {
      list-style: none;
      line-height: 1.8;
    }

    #controls-info kbd {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 0.8rem;
    }

    /* Click to Start Overlay */
    #click-to-start {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    #click-to-start.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #click-to-start .content {
      text-align: center;
      color: #fff;
    }

    #click-to-start h2 {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: #4a90d9;
    }

    #click-to-start p {
      font-size: 1.2rem;
      color: #ccc;
    }

    #click-to-start .icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    /* Error Message */
    #error-message {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(220, 53, 69, 0.9);
      color: #fff;
      padding: 15px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      z-index: 1001;
      display: none;
      max-width: 400px;
    }

    #error-message.visible {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader"></div>
    <h1>Virtual Museum</h1>
    <p>Loading gallery...</p>
    <div id="loading-progress">Fetching images...</div>
  </div>

  <!-- Click to Start Overlay -->
  <div id="click-to-start">
    <div class="content">
      <div class="icon">🏛️</div>
      <h2>Welcome to the Virtual Museum</h2>
      <p>Click anywhere to enter</p>
    </div>
  </div>

  <!-- Controls Info -->
  <div id="controls-info">
    <h3>🎮 Controls</h3>
    <ul>
      <li><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> - Move around</li>
      <li><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> - Alternative movement</li>
      <li>Mouse - Look around</li>
      <li><kbd>ESC</kbd> - Release mouse cursor</li>
    </ul>
  </div>

  <!-- Error Message -->
  <div id="error-message"></div>

  <!-- Import Map for Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <!-- Main Museum Script -->
  <script type="module" src="/museum.js"></script>
</body>
</html>
